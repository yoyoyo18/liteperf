# LitePerf default configuration (TOML-ish)
# All experimental features are disabled by default. Change values in the config/ folder in the run directory.
# You can force features on even when compatibly-detected mods exist by setting compat.preferCompatibility=false

[general]
enabled = true
modId = "liteperf"

[render]
asyncChunkMeshUpload = true
aggressiveCulling = true
instancing = false # experimental
frameGeneration = false # experimental - motion-vector temporal reprojection (may produce artifacts)

[tick]
entityTickThrottling = true
blockEntityTickThrottling = true
throttleDistance = 64.0

[compat]
# If true, the mod will automatically disable features known to conflict with other popular mods (Sodium, Lithium, FerriteCore).
# Set to false to force-enable features even when those mods are present (not recommended).
preferCompatibility = true

# Per-mod overrides (optional)
sodium = true
lithium = true
ferritecore = true

[profiling]
enabled = false
intervalSeconds = 10
