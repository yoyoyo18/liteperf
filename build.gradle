plugins {
    id 'java'
    id 'maven-publish'
    id 'fabric-loom' version '1.3.5'
}

group = 'com.yoyoyo18'
version = '0.1.0'
archivesBaseName = 'liteperf'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

def minecraft_version = "1.26.2"
def loader_version = "0.19.3"
def fabric_api_version = "0.149.1+26.1.2"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// NOTE: You may need to adjust the loom plugin version and mappings to match your environment.
// This build.gradle provides a starting point for building with Gradle + Fabric Loom.
